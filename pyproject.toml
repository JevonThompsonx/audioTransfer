[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audioTransfer"
version = "2.0.0"
description = "Organize and transfer audiobooks to Audiobookshelf"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
ssh = ["paramiko"]

# NOTE: No [project.scripts] entry. The Python `audiobook_transfer` package is
# frozen/legacy and historically shipped a `audiotransfer` console-script that
# COLLIDED with the safe Go binary of the same name — `pip install` could
# shadow the Go implementation (which has the chmod-777/root-default bugs
# removed). The canonical `audiotransfer` entrypoint is the Go binary.

[tool.setuptools.packages.find]
include = ["audiobook_transfer*"]
