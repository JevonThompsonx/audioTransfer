name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: gofmt / vet / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Check go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the result."
            git --no-pager diff go.mod go.sum
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-compliant:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  govulncheck:
    name: govulncheck (vulnerability scan)
    # Advisory only: the only findings on the 1.23 toolchain line are Go standard
    # library CVEs that can only be cleared by moving to a newer Go minor/patch.
    # Blocking the build on those (unfixable while pinned to 1.23) would make CI
    # permanently red. Keep this visible but non-blocking; revisit when Go is bumped.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      # Pin to v1.1.4: newer govulncheck requires Go >= 1.25 and forces a
      # toolchain upgrade, which conflicts with this repo's 1.23 pin.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: $(go env GOPATH)/bin/govulncheck ./...
